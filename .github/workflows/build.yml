name: Build LiMaD OS (GNOME)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Also build a bootable ISO"
        type: boolean
        default: true
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: limad-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Offline validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Run the full offline test suite
        run: bash tests/validate.sh

  image:
    name: Build and push container image
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Install verified OCI runtime
        run: |
          set -Eeuo pipefail
          sudo bash build_files/install-ci-oci-runtime.sh /usr/local/bin/runc-limad
          echo "LIMAD_OCI_RUNTIME=/usr/local/bin/runc-limad" >> "$GITHUB_ENV"
          echo "BUILDAH_RUNTIME=/usr/local/bin/runc-limad" >> "$GITHUB_ENV"

      - name: Install registry validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Compute image metadata
        id: meta
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${LIMAD_OS_VERSION}-${LIMAD_BUILD_REVISION}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          {
            echo "image=ghcr.io/${OWNER}/${LIMAD_IMAGE_NAME}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/${OWNER}/${LIMAD_IMAGE_NAME}:${TAG}"

      - name: Build image
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          podman build \
            --runtime "${LIMAD_OCI_RUNTIME}" \
            --format oci \
            --build-arg "BASE_IMAGE_REF=${BASE_IMAGE_REF}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .

      - name: Basis-Digest festhalten
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          DIGEST="$(podman image inspect "${BASE_IMAGE_REF}" \
            --format '{{.Digest}}' 2>/dev/null || echo unbekannt)"
          {
            echo "### Basis-Abbild dieses Builds"
            echo
            echo '```'
            echo "${BASE_IMAGE_REF}"
            echo "${DIGEST}"
            echo '```'
            echo
            echo "Zum Einfrieren eines funktionierenden Standes in"
            echo "\`build_files/versions.env\` eintragen:"
            echo
            echo '```'
            echo "BASE_IMAGE_REF=\"${BASE_IMAGE}@${DIGEST}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the committed image
        run: |
          set -Eeuo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          podman run --rm \
            --runtime "${LIMAD_OCI_RUNTIME}" \
            --user 0 \
            --entrypoint /usr/bin/bash \
            -v "${PWD}/build_files/post-commit-check.sh:/tmp/limad-post-commit-check.sh:ro" \
            "$IMAGE" /tmp/limad-post-commit-check.sh

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        run: |
          set -Eeuo pipefail

          push_with_retries() {
            local reference="$1" attempt log
            log="$(mktemp)"

            for attempt in 1 2 3; do
              echo "Push ${reference} (Versuch ${attempt}/3)"

              if podman push "$reference" 2>&1 | tee "$log"; then
                echo "Erfolgreich"
                rm -f "$log"
                return 0
              fi

              if grep -Eq 'StatusCode: 403|permission_denied: write_package|denied: permission_denied' "$log"; then
                {
                  echo
                  echo "GitHub verweigert das Schreiben in dieses Paket (HTTP 403),"
                  echo "obwohl die Anmeldung gelungen ist."
                  echo
                  echo "Lösung A:"
                  echo "GitHub -> Profil -> Packages -> Paket öffnen"
                  echo "-> Package settings -> Manage Actions access"
                  echo "-> dieses Repository hinzufügen, Rolle 'Write'"
                  echo
                  echo "Lösung B:"
                  echo "LIMAD_IMAGE_NAME in build_files/versions.env ändern."
                } >&2

                rm -f "$log"
                return 1
              fi

              echo "Fehlgeschlagen. Neuer Anmeldeversuch in 30 Sekunden." >&2
              sleep 30

              echo "${{ secrets.GITHUB_TOKEN }}" \
                | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            done

            echo "Push von ${reference} auch nach drei Versuchen fehlgeschlagen." >&2
            rm -f "$log"
            return 1
          }

          push_with_retries "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          push_with_retries "${{ steps.meta.outputs.image }}:latest"

      - name: Öffentliche Update-Erreichbarkeit prüfen
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          IMAGE="${{ steps.meta.outputs.image }}:latest"
          EMPTY_AUTH="$(mktemp)"
          printf '{"auths":{}}\n' > "$EMPTY_AUTH"

          if ! skopeo inspect --authfile "$EMPTY_AUTH" "docker://${IMAGE}" \
            >/tmp/limad-public-image.json 2>/tmp/limad-public-image.err; then

            cat /tmp/limad-public-image.err >&2

            {
              echo
              echo "FATAL: Das neue LiMaD-Systemabbild ist anonym nicht erreichbar."
              echo "Installierte LiMaD-Systeme würden bei rpm-ostree mit 'unauthorized' abbrechen."
              echo
              echo "Einmalig auf GitHub einstellen:"
              echo "Profil -> Packages -> ${LIMAD_IMAGE_NAME} -> Package settings"
              echo "-> Change visibility -> Public"
              echo
              echo "Danach diesen Workflow über 'Re-run failed jobs' erneut ausführen."
              echo "Der ISO-Bau bleibt gesperrt, solange Systemupdates nicht funktionieren."
            } >&2

            exit 1
          fi

          echo "PASS: ${IMAGE} ist ohne Anmeldung erreichbar."

  iso:
    name: Build installable ISO
    needs: image
    if: github.event_name != 'workflow_dispatch' || inputs.build_iso
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install verified OCI runtime
        run: |
          set -Eeuo pipefail
          sudo bash build_files/install-ci-oci-runtime.sh /usr/local/bin/runc-limad
          echo "LIMAD_OCI_RUNTIME=/usr/local/bin/runc-limad" >> "$GITHUB_ENV"
          echo "BUILDAH_RUNTIME=/usr/local/bin/runc-limad" >> "$GITHUB_ENV"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Basis-Abbild bereitstellen
        run: |
          set -Eeuo pipefail
          IMAGE="${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "Lade ${IMAGE}"
          sudo podman pull "$IMAGE"
          sudo podman image inspect "$IMAGE" --format 'Grösse: {{.Size}} Bytes'
          df -h /

      - name: Repository-Schlüssel für den ISO-Bauer bereitstellen
        run: |
          set -Eeuo pipefail
          IMAGE="${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}"
          WRAPPER="localhost/limad-bootc-image-builder:${{ needs.image.outputs.tag }}"
          sudo env LIMAD_OCI_RUNTIME="${LIMAD_OCI_RUNTIME}" \
            BUILDAH_RUNTIME="${LIMAD_OCI_RUNTIME}" \
            bash build_files/prepare-bib-key-wrapper.sh \
            "$IMAGE" "$WRAPPER" /tmp/limad-bib-key-wrapper
          echo "LIMAD_BIB_IMAGE=${WRAPPER}" >> "$GITHUB_ENV"

      - name: Install ISO branding tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools python3-pil mtools isomd5sum

      - name: Build and validate source ISO
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          mkdir -p output
          echo "Dateisystem: ${LIMAD_ROOTFS}"
          echo "ISO-Bauer: ${LIMAD_BIB_IMAGE}"

          BIB_CONTAINER="limad-bib-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_bib() {
            sudo podman rm -f "$BIB_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_bib EXIT
          cleanup_bib

          set +e
          sudo podman run --runtime "${LIMAD_OCI_RUNTIME}" --name "$BIB_CONTAINER" --privileged \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./disk_config:/config:ro \
            "${LIMAD_BIB_IMAGE}" \
            --output /output \
            --type anaconda-iso \
            --rootfs "${LIMAD_ROOTFS}" \
            --config /config/iso.toml \
            "${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}" \
            2>&1 | tee output/bootc-image-builder.log
          BIB_RC="${PIPESTATUS[0]}"
          set -e

          echo "bootc-image-builder exit code: ${BIB_RC}"
          sudo chown -R "$USER":"$USER" output

          SOURCE_ISO="$(find output -name '*.iso' -type f -size +1M -print -quit)"
          [[ -n "$SOURCE_ISO" ]] || {
            echo "bootc-image-builder lieferte Exit ${BIB_RC} und keine ISO." >&2
            if (( BIB_RC != 0 )); then
              exit "$BIB_RC"
            fi
            exit 1
          }

          {
            echo "=== ISO file tree ==="
            xorriso -indev "$SOURCE_ISO" -find / -type f -exec lsdl --
          } > output/source-iso-layout.txt 2>&1 || true
          {
            echo "=== El Torito ==="
            xorriso -indev "$SOURCE_ISO" -report_el_torito plain
            echo
            echo "=== System area ==="
            xorriso -indev "$SOURCE_ISO" -report_system_area plain
            echo
            echo "=== PVD ==="
            xorriso -indev "$SOURCE_ISO" -pvd_info
          } > output/source-iso-boot-report.txt 2>&1 || true

          bash tools/verify-source-iso.sh "$SOURCE_ISO"

          case "$BIB_RC" in
            0)
              echo "bootc-image-builder wurde regulär beendet."
              ;;
            5)
              echo "::warning::bootc-image-builder lieferte nach 'Build complete' Exit 5. Die erzeugte ISO hat die verbindliche Struktur- und Medienprüfung bestanden; der Workflow fährt kontrolliert fort."
              ;;
            *)
              echo "Unerwarteter bootc-image-builder-Exitcode ${BIB_RC}; die ISO wird trotz vorhandener Datei nicht freigegeben." >&2
              exit "$BIB_RC"
              ;;
          esac

          echo "SOURCE_ISO=${SOURCE_ISO}" >> "$GITHUB_ENV"
          echo "BIB_EXIT_CODE=${BIB_RC}" >> "$GITHUB_ENV"

      - name: Brand and verify final ISO
        run: |
          set -Eeuo pipefail
          source build_files/versions.env
          [[ -n "${SOURCE_ISO:-}" && -s "$SOURCE_ISO" ]] || {
            echo "Geprüfte Quell-ISO fehlt." >&2
            exit 1
          }

          BRANDED_ISO="output/LiMaD-OS-${LIMAD_OS_VERSION}-${LIMAD_BUILD_REVISION}.iso"
          sudo bash tools/brand-installer-iso.sh "$SOURCE_ISO" "$BRANDED_ISO"
          sudo chown "$USER":"$USER" "$BRANDED_ISO"

          if [[ "$SOURCE_ISO" != "$BRANDED_ISO" ]]; then
            rm -f "$SOURCE_ISO"
          fi

          bash tools/verify-branded-iso.sh "$BRANDED_ISO"
          sha256sum "$BRANDED_ISO"

          {
            echo "### ISO-Bau"
            echo
            echo "- bootc-image-builder Exitcode: ${BIB_EXIT_CODE}"
            echo "- Quell-ISO-Strukturprüfung: PASS"
            echo "- LiMaD-Nachbearbeitung und tiefe Bootprüfung: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload builder diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: LiMaD-OS-${{ needs.image.outputs.tag }}-BIB-Diagnostics
          path: |
            output/bootc-image-builder.log
            output/source-iso-layout.txt
            output/source-iso-boot-report.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: LiMaD-OS-${{ needs.image.outputs.tag }}-ISO
          path: output/**/*.iso
          retention-days: 3
          compression-level: 0
