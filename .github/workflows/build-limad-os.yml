name: Build LiMaD OS 3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: limad-os-3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate LiMaD source
        run: bash tests/validate.sh

  build:
    name: Build Ubuntu-based ISO
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools rsync curl ca-certificates python3 zip git util-linux

      - name: Build LiMaD OS 3.0
        run: sudo bash build_files/build-iso.sh "$GITHUB_WORKSPACE/.work" "$GITHUB_WORKSPACE/out"

      - name: Show build outputs
        run: |
          find out -maxdepth 2 -type f -printf '%p  %s bytes\n' | sort
          cat out/BUILD-INFO.txt

      - name: Upload LiMaD OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: LiMaD-OS-3.0-ISO
          path: |
            out/LiMaD-OS-*.iso
            out/LiMaD-OS-*.iso.sha256
            out/BUILD-INFO.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload independent LiMaD app updates
        uses: actions/upload-artifact@v4
        with:
          name: LiMaD-OS-3.0-App-Updates
          path: out/updates/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
